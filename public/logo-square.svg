<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kenotic Labs">
  <!-- Background -->
  <rect width="512" height="512" fill="#0E0E0C"/>

  <!-- Subtle radial vignette for depth -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1A1814" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E0E0C" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#vignette)"/>

  <!-- Centered serif K -->
  <text
    x="256"
    y="320"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="320"
    font-weight="700"
    fill="#F5F2EA"
    text-anchor="middle"
    letter-spacing="-8"
  >K</text>

  <!-- Gold accent line under the K -->
  <line
    x1="216"
    y1="368"
    x2="296"
    y2="368"
    stroke="#B39B5C"
    stroke-width="6"
    stroke-linecap="square"
  />
</svg>
