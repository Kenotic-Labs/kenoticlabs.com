  * { margin: 0; padding: 0; box-sizing: border-box; }

  .switcher {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;

  .switcher button {
    padding: 6px 14px; border: 1px solid #333; background: transparent; color: #777;
    font: 600 10px/1 'Lato'; cursor: pointer; border-radius: 100px; transition: all 0.3s;
  }
  .switcher button.active { background: #fff; color: #000; border-color: #fff; }
  .switcher button:hover { border-color: #555; }

  .option.active { display: block; }

<script>
const classes = ['g1','g2','s1','s2','gd1','gd2','mix1','mix2','mix3'];

function makeOpt(id, cls) {
  return `<div class="option ${cls}" id="opt${id}" ${id===1?'class="option '+cls+' active"':''}>
    <div class="hero">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="inner">
        <div class="label">Kenotic Labs</div>
        <h1>We gave machines intelligence.<br>We never gave them time.</h1>
        <p class="sub">The hard part is continuity. The ability to carry forward what matters, update it when reality changes, and reconstruct it when it is needed again.</p>
        <div class="divider"></div>
      </div>
    </div>
    <div class="sect">
      <div class="label">What We Build</div>
      <h2>The continuity layer.</h2>
      <p>Continuity is the system property that lets an AI carry forward what still matters, update it when reality changes, and reconstruct useful context later.</p>
      <div class="grid2">
        <div class="card"><div class="num">01</div><h3>Reconstruction</h3><p>Not finding old facts. Rebuilding the current picture from structured traces.</p></div>
        <div class="card"><div class="num">02</div><h3>Disambiguation</h3><p>250 lives in one system. Each story stays separate from every other.</p></div>
        <div class="card"><div class="num">03</div><h3>Update Handling</h3><p>The appointment moved. The plan changed. Old state gets superseded.</p></div>
        <div class="card"><div class="num">04</div><h3>Temporal Ordering</h3><p>Not just what happened. When, in what order, and what's still true.</p></div>
      </div>
    </div>
    <div class="sect sect-alt">
      <div class="label">Evidence</div>
      <h2>Tested against 250 narratives.</h2>
      <p>ATANT is the first open evaluation framework for AI continuity. No LLM in the evaluation loop. Deterministic. Reproducible.</p>
      <div class="metrics">
        <div class="metric"><div class="val">250</div><div class="lbl">Stories</div></div>
        <div class="metric"><div class="val">1,835</div><div class="lbl">Questions</div></div>
        <div class="metric"><div class="val">96%</div><div class="lbl">Cumulative</div></div>
        <div class="metric"><div class="val">10</div><div class="lbl">Checkpoints</div></div>
      </div>
      <button class="cta-btn">View the Standard</button>
    </div>
    <div class="footer">
      <p class="quote">What knows you well, should wish you well.</p>
      <p class="copy">© 2026 Kenotic Labs. All rights reserved.</p>
    </div>
  </div>`;
}

const wrapper = document.createElement('div');
classes.forEach((c, i) => wrapper.innerHTML += makeOpt(i+1, c));
document.body.appendChild(wrapper);
document.querySelector('.option').classList.add('active');

function show(n, cls) {
  document.querySelectorAll('.option').forEach(el => { el.style.display='none'; el.classList.remove('active'); });
  document.getElementById('opt'+n).style.display='block';
  document.getElementById('opt'+n).classList.add('active');
  document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  window.scrollTo(0,0);
}
</script>
