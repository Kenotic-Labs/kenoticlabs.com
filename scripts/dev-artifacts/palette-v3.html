<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenotic Labs, Layout 1 Color Variations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .switcher {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
    padding: 14px 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .switcher span { color: #555; font: 700 10px/1 'Lato'; letter-spacing: 3px; text-transform: uppercase; margin-right: 8px; }
  .switcher button {
    padding: 7px 16px; border: 1px solid #333; background: transparent; color: #777;
    font: 600 11px/1 'Lato'; cursor: pointer; border-radius: 100px; transition: all 0.3s;
  }
  .switcher button.active { background: #fff; color: #000; border-color: #fff; }
  .switcher button:hover { border-color: #555; }

  .option { display: none; margin-top: 52px; font-family: 'Lato', sans-serif; }
  .option.active { display: block; }

  /* Shared layout (Option 1 structure) */
  .option .hero {
    min-height: 92vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 120px 40px 80px;
  }
  .option .hero .label { font: 700 11px/1 'Lato'; letter-spacing: 7px; text-transform: uppercase; margin-bottom: 40px; }
  .option .hero h1 { font: 700 clamp(2.8rem,5.5vw,4.5rem)/1.05 'Playfair Display'; max-width: 820px; margin: 0 auto; letter-spacing: -0.01em; }
  .option .hero .sub { font: 300 1.15rem/1.75 'Lato'; max-width: 520px; margin: 28px auto 0; }
  .option .hero .divider { width: 48px; height: 2px; margin: 52px auto 0; }

  .option .sect { padding: 100px 80px; max-width: 1200px; margin: 0 auto; }
  .option .sect .label { font: 700 10px/1 'Lato'; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 24px; }
  .option .sect h2 { font: 700 clamp(1.8rem,3vw,2.6rem)/1.12 'Playfair Display'; margin-bottom: 16px; }
  .option .sect p { font: 400 1.02rem/1.85 'Lato'; max-width: 560px; }
  .option .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
  .option .card { border-radius: 16px; padding: 36px; transition: transform 0.4s, box-shadow 0.4s; }
  .option .card:hover { transform: translateY(-3px); }
  .option .card h3 { font: 700 1.1rem/1.3 'Lato'; margin-bottom: 8px; }
  .option .card p { font-size: 0.92rem; }
  .option .card .num { font: 700 0.65rem/1 'Lato'; letter-spacing: 3px; margin-bottom: 14px; }

  .option .metrics { display: flex; gap: 52px; margin-top: 48px; }
  .option .metric .val { font: 700 2.8rem/1 'Playfair Display'; }
  .option .metric .lbl { font: 700 0.7rem/1 'Lato'; letter-spacing: 1.5px; margin-top: 8px; text-transform: uppercase; }

  .option .cta-btn {
    display: inline-block; padding: 14px 32px; font: 700 0.72rem/1 'Lato';
    letter-spacing: 2px; text-transform: uppercase; border: none; cursor: pointer;
    border-radius: 8px; margin-top: 36px; transition: all 0.3s;
  }

  .option .footer { padding: 52px 80px; text-align: center; }
  .option .footer .quote { font: italic 400 1rem/1.6 'Playfair Display'; }
  .option .footer .copy { font: 400 0.75rem/1 'Lato'; margin-top: 16px; letter-spacing: 1px; }

  /* ===== V1: DEEP TEAL + WARM CREAM ===== */
  .v1 { background: #FBF9F5; }
  .v1 .hero { background: linear-gradient(180deg, #FBF9F5 0%, #F4F0E8 100%); }
  .v1 .hero .label { color: #2A7B6F; }
  .v1 .hero h1 { color: #1B2E28; }
  .v1 .hero .sub { color: #6B7A6F; }
  .v1 .hero .divider { background: linear-gradient(90deg, #2A7B6F, #8BC4A8); }
  .v1 .sect .label { color: #2A7B6F; }
  .v1 .sect h2 { color: #1B2E28; }
  .v1 .sect p { color: #4A5A4E; }
  .v1 .sect-alt { background: #F0EDE5; }
  .v1 .card { background: #FFFFFF; box-shadow: 0 2px 28px rgba(27,46,40,0.05); }
  .v1 .card:hover { box-shadow: 0 8px 40px rgba(27,46,40,0.08); }
  .v1 .card h3 { color: #1B2E28; }
  .v1 .card p { color: #5A6B5E; }
  .v1 .card .num { color: #2A7B6F; }
  .v1 .metric .val { color: #2A7B6F; }
  .v1 .metric .lbl { color: #8A9A8E; }
  .v1 .cta-btn { background: #2A7B6F; color: #fff; }
  .v1 .cta-btn:hover { background: #23695F; }
  .v1 .footer { background: #1B2E28; }
  .v1 .footer .quote { color: #8BC4A8; opacity: 0.6; }
  .v1 .footer .copy { color: #4A5A4E; }

  /* ===== V2: TERRACOTTA + OFF-WHITE ===== */
  .v2 { background: #FAF7F3; }
  .v2 .hero { background: linear-gradient(180deg, #FAF7F3 0%, #F2EBE2 100%); }
  .v2 .hero .label { color: #B85C3A; }
  .v2 .hero h1 { color: #2C1E14; }
  .v2 .hero .sub { color: #7A6B5E; }
  .v2 .hero .divider { background: linear-gradient(90deg, #B85C3A, #E8A87C); }
  .v2 .sect .label { color: #B85C3A; }
  .v2 .sect h2 { color: #2C1E14; }
  .v2 .sect p { color: #5A4E42; }
  .v2 .sect-alt { background: #F0E8DD; }
  .v2 .card { background: #FFFFFF; box-shadow: 0 2px 28px rgba(44,30,20,0.05); }
  .v2 .card:hover { box-shadow: 0 8px 40px rgba(44,30,20,0.08); }
  .v2 .card h3 { color: #2C1E14; }
  .v2 .card p { color: #6B5D50; }
  .v2 .card .num { color: #B85C3A; }
  .v2 .metric .val { color: #B85C3A; }
  .v2 .metric .lbl { color: #A09080; }
  .v2 .cta-btn { background: #B85C3A; color: #fff; }
  .v2 .cta-btn:hover { background: #A04E30; }
  .v2 .footer { background: #2C1E14; }
  .v2 .footer .quote { color: #E8A87C; opacity: 0.5; }
  .v2 .footer .copy { color: #5A4E42; }

  /* ===== V3: STEEL BLUE + PEARL ===== */
  .v3 { background: #F7F8FA; }
  .v3 .hero { background: linear-gradient(180deg, #F7F8FA 0%, #EDF0F5 100%); }

  .v3 .hero h1 { color: #1A2836; }
  .v3 .hero .sub { color: #5E7080; }
  .v3 .hero .divider { background: linear-gradient(90deg, #3D6B8E, #8AB4D4); }
  .v3 .sect .label { color: #3D6B8E; }
  .v3 .sect h2 { color: #1A2836; }
  .v3 .sect p { color: #465568; }
  .v3 .sect-alt { background: #EBF0F5; }
  .v3 .card { background: #FFFFFF; box-shadow: 0 2px 28px rgba(26,40,54,0.05); }
  .v3 .card:hover { box-shadow: 0 8px 40px rgba(26,40,54,0.08); }
  .v3 .card h3 { color: #1A2836; }
  .v3 .card p { color: #5A6A7A; }
  .v3 .card .num { color: #3D6B8E; }
  .v3 .metric .val { color: #3D6B8E; }
  .v3 .metric .lbl { color: #8A9AAA; }
  .v3 .cta-btn { background: #3D6B8E; color: #fff; }
  .v3 .cta-btn:hover { background: #335C7A; }
  .v3 .footer { background: #1A2836; }
  .v3 .footer .quote { color: #8AB4D4; opacity: 0.5; }
  .v3 .footer .copy { color: #465568; }

  /* ===== V4: PLUM + WARM LINEN ===== */
  .v4 { background: #F9F6F3; }
  .v4 .hero { background: linear-gradient(180deg, #F9F6F3 0%, #F0EAE3 100%); }
  .v4 .hero .label { color: #7B4F82; }
  .v4 .hero h1 { color: #28172C; }
  .v4 .hero .sub { color: #706470; }
  .v4 .hero .divider { background: linear-gradient(90deg, #7B4F82, #C89ED0); }
  .v4 .sect .label { color: #7B4F82; }
  .v4 .sect h2 { color: #28172C; }
  .v4 .sect p { color: #55485A; }
  .v4 .sect-alt { background: #EDE6E0; }
  .v4 .card { background: #FFFFFF; box-shadow: 0 2px 28px rgba(40,23,44,0.05); }
  .v4 .card:hover { box-shadow: 0 8px 40px rgba(40,23,44,0.08); }
  .v4 .card h3 { color: #28172C; }
  .v4 .card p { color: #665A6B; }
  .v4 .card .num { color: #7B4F82; }
  .v4 .metric .val { color: #7B4F82; }
  .v4 .metric .lbl { color: #9A8E9A; }
  .v4 .cta-btn { background: #7B4F82; color: #fff; }
  .v4 .cta-btn:hover { background: #6A4270; }
  .v4 .footer { background: #28172C; }
  .v4 .footer .quote { color: #C89ED0; opacity: 0.5; }
  .v4 .footer .copy { color: #55485A; }

  /* ===== V5: FOREST OLIVE + BONE ===== */
  .v5 { background: #F8F6F1; }
  .v5 .hero { background: linear-gradient(180deg, #F8F6F1 0%, #EFEAE0 100%); }
  .v5 .hero .label { color: #5E7A4A; }
  .v5 .hero h1 { color: #1E2816; }
  .v5 .hero .sub { color: #6A7A5E; }
  .v5 .hero .divider { background: linear-gradient(90deg, #5E7A4A, #A8C890); }
  .v5 .sect .label { color: #5E7A4A; }
  .v5 .sect h2 { color: #1E2816; }
  .v5 .sect p { color: #4A5A3E; }
  .v5 .sect-alt { background: #ECEADE; }
  .v5 .card { background: #FEFDFB; box-shadow: 0 2px 28px rgba(30,40,22,0.05); }
  .v5 .card:hover { box-shadow: 0 8px 40px rgba(30,40,22,0.08); }
  .v5 .card h3 { color: #1E2816; }
  .v5 .card p { color: #5A6A4E; }
  .v5 .card .num { color: #5E7A4A; }
  .v5 .metric .val { color: #5E7A4A; }
  .v5 .metric .lbl { color: #8A9A7E; }
  .v5 .cta-btn { background: #5E7A4A; color: #fff; }
  .v5 .cta-btn:hover { background: #4E6A3C; }
  .v5 .footer { background: #1E2816; }
  .v5 .footer .quote { color: #A8C890; opacity: 0.5; }
  .v5 .footer .copy { color: #4A5A3E; }

  /* ===== V6: BURGUNDY + PARCHMENT ===== */
  .v6 { background: #FAF6F2; }
  .v6 .hero { background: linear-gradient(180deg, #FAF6F2 0%, #F0E8DE 100%); }
  .v6 .hero .label { color: #8C3A3A; }
  .v6 .hero h1 { color: #2A1414; }
  .v6 .hero .sub { color: #7A5E5E; }
  .v6 .hero .divider { background: linear-gradient(90deg, #8C3A3A, #D4908E); }
  .v6 .sect .label { color: #8C3A3A; }
  .v6 .sect h2 { color: #2A1414; }
  .v6 .sect p { color: #5A4444; }
  .v6 .sect-alt { background: #EDE4DA; }
  .v6 .card { background: #FFFFFF; box-shadow: 0 2px 28px rgba(42,20,20,0.05); }
  .v6 .card:hover { box-shadow: 0 8px 40px rgba(42,20,20,0.08); }
  .v6 .card h3 { color: #2A1414; }
  .v6 .card p { color: #6A5252; }
  .v6 .card .num { color: #8C3A3A; }
  .v6 .metric .val { color: #8C3A3A; }
  .v6 .metric .lbl { color: #A08888; }
  .v6 .cta-btn { background: #8C3A3A; color: #fff; }
  .v6 .cta-btn:hover { background: #7A3030; }
  .v6 .footer { background: #2A1414; }
  .v6 .footer .quote { color: #D4908E; opacity: 0.5; }
  .v6 .footer .copy { color: #5A4444; }

  /* ===== V7: MIDNIGHT INDIGO + CLOUD ===== */
  .v7 { background: #F6F7FB; }
  .v7 .hero { background: linear-gradient(180deg, #F6F7FB 0%, #ECEEF6 100%); }
  .v7 .hero .label { color: #4A4A8A; }
  .v7 .hero h1 { color: #1A1A30; }
  .v7 .hero .sub { color: #6060808; }
  .v7 .hero .divider { background: linear-gradient(90deg, #4A4A8A, #9090CC); }
  .v7 .sect .label { color: #4A4A8A; }
  .v7 .sect h2 { color: #1A1A30; }
  .v7 .sect p { color: #484860; }
  .v7 .sect-alt { background: #E8EAF2; }
  .v7 .card { background: #FFFFFF; box-shadow: 0 2px 28px rgba(26,26,48,0.05); }
  .v7 .card:hover { box-shadow: 0 8px 40px rgba(26,26,48,0.08); }
  .v7 .card h3 { color: #1A1A30; }
  .v7 .card p { color: #5A5A72; }
  .v7 .card .num { color: #4A4A8A; }
  .v7 .metric .val { color: #4A4A8A; }
  .v7 .metric .lbl { color: #8A8AA0; }

  .v7 .cta-btn:hover { background: #3E3E78; }
  .v7 .footer { background: #1A1A30; }
  .v7 .footer .quote { color: #9090CC; opacity: 0.5; }

  /* ===== V8: COPPER + STONE ===== */
  .v8 { background: #F5F3EE; }
  .v8 .hero { background: linear-gradient(180deg, #F5F3EE 0%, #E8E4DB 100%); }
  .v8 .hero .label { color: #A0714A; }
  .v8 .hero h1 { color: #2A2218; }
  .v8 .hero .sub { color: #70685A; }
  .v8 .hero .divider { background: linear-gradient(90deg, #A0714A, #D4B08A); }
  .v8 .sect .label { color: #A0714A; }
  .v8 .sect h2 { color: #2A2218; }
  .v8 .sect p { color: #554D40; }
  .v8 .sect-alt { background: #E6E0D5; }
  .v8 .card { background: #FDFCF9; box-shadow: 0 2px 28px rgba(42,34,24,0.05); }
  .v8 .card:hover { box-shadow: 0 8px 40px rgba(42,34,24,0.08); }
  .v8 .card h3 { color: #2A2218; }
  .v8 .card p { color: #665D50; }
  .v8 .card .num { color: #A0714A; }
  .v8 .metric .val { color: #A0714A; }

</style>
</head>
<body>

<div class="switcher">
  <span>Color</span>
  <button class="active" onclick="show(1)">Teal + Cream</button>
  <button onclick="show(2)">Terracotta</button>
  <button onclick="show(3)">Steel Blue</button>
  <button onclick="show(4)">Plum</button>
  <button onclick="show(5)">Forest Olive</button>
  <button onclick="show(6)">Burgundy</button>
  <button onclick="show(7)">Indigo</button>
  <button onclick="show(8)">Copper</button>
</div>

<script>
function makeOption(n, cls) {
  return `
  <div class="option ${cls}" id="opt${n}" ${n===1?'style="display:block"':''}>
    <div class="hero">
      <div>
        <div class="label">Kenotic Labs</div>
        <h1>We gave machines intelligence.<br>We never gave them time.</h1>
        <p class="sub">The hard part is continuity. The ability to carry forward what matters, update it when reality changes, and reconstruct it when it is needed again.</p>
        <div class="divider"></div>
      </div>
    </div>
    <div class="sect">
      <div class="label">What We Build</div>
      <h2>The continuity layer.</h2>
      <p>Continuity is the system property that lets an AI carry forward what still matters, update it when reality changes, and reconstruct useful context later.</p>
      <div class="grid2">
        <div class="card"><div class="num">01</div><h3>Reconstruction</h3><p>Not finding old facts. Rebuilding the current picture from structured traces.</p></div>
        <div class="card"><div class="num">02</div><h3>Disambiguation</h3><p>250 lives in one system. Each story stays separate from every other.</p></div>
        <div class="card"><div class="num">03</div><h3>Update Handling</h3><p>The appointment moved. The plan changed. Old state gets superseded.</p></div>
        <div class="card"><div class="num">04</div><h3>Temporal Ordering</h3><p>Not just what happened. When, in what order, and what's still true.</p></div>
      </div>
    </div>
    <div class="sect sect-alt">
      <div class="label">Evidence</div>
      <h2>Tested against 250 narratives.</h2>
      <p>ATANT is the first open evaluation framework for AI continuity. No LLM in the evaluation loop. Deterministic. Reproducible.</p>
      <div class="metrics">
        <div class="metric"><div class="val">250</div><div class="lbl">Stories</div></div>
        <div class="metric"><div class="val">1,835</div><div class="lbl">Questions</div></div>
        <div class="metric"><div class="val">96%</div><div class="lbl">Cumulative</div></div>
        <div class="metric"><div class="val">10</div><div class="lbl">Checkpoints</div></div>
      </div>
      <button class="cta-btn">View the Standard</button>
    </div>
    <div class="footer">
      <p class="quote">What knows you well, should wish you well.</p>
      <p class="copy">© 2026 Kenotic Labs. All rights reserved.</p>
    </div>
  </div>`;
}

const classes = ['v1','v2','v3','v4','v5','v6','v7','v8'];
const container = document.createElement('div');
classes.forEach((c, i) => container.innerHTML += makeOption(i+1, c));
document.body.appendChild(container);

// Show first by default
document.querySelector('.option').classList.add('active');

function show(n) {
  document.querySelectorAll('.option').forEach(el => { el.style.display = 'none'; el.classList.remove('active'); });
  const el = document.getElementById('opt' + n);
  el.style.display = 'block';
  el.classList.add('active');
  document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  window.scrollTo(0, 0);
}
</script>

</body>
</html>
