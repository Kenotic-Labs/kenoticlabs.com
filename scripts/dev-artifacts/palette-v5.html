<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenotic Labs, Green + Silver + Gold (Unified)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .switcher {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
    padding: 14px 24px; display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .switcher span { color: #555; font: 700 9px/1 'Lato'; letter-spacing: 3px; text-transform: uppercase; margin-right: 8px; }
  .switcher button {
    padding: 7px 16px; border: 1px solid #333; background: transparent; color: #777;
    font: 600 11px/1 'Lato'; cursor: pointer; border-radius: 100px; transition: all 0.3s;
  }
  .switcher button.active { background: #fff; color: #000; border-color: #fff; }
  .switcher button:hover { border-color: #555; }

  .option { display: none; margin-top: 50px; font-family: 'Lato', sans-serif; }
  .option.active { display: block; }

  /* Shared layout */
  .option .hero {
    min-height: 92vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 120px 40px 80px; position: relative; overflow: hidden;
  }
  .option .hero .glow {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    filter: blur(140px); opacity: 0.08; pointer-events: none;
  }
  .option .hero .glow-1 { top: -80px; right: -60px; }
  .option .hero .glow-2 { bottom: -120px; left: -80px; }
  .option .hero .inner { position: relative; z-index: 1; }
  .option .hero .label { font: 700 11px/1 'Lato'; letter-spacing: 7px; text-transform: uppercase; margin-bottom: 40px; }
  .option .hero h1 { font: 700 clamp(2.8rem,5.5vw,4.5rem)/1.05 'Playfair Display'; max-width: 820px; margin: 0 auto; }
  .option .hero .sub { font: 300 1.15rem/1.75 'Lato'; max-width: 520px; margin: 28px auto 0; }
  .option .hero .divider { width: 48px; height: 2px; margin: 52px auto 0; }

  .option .sect { padding: 100px 80px; max-width: 1200px; margin: 0 auto; }
  .option .sect .label { font: 700 10px/1 'Lato'; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 24px; }
  .option .sect h2 { font: 700 clamp(1.8rem,3vw,2.6rem)/1.12 'Playfair Display'; margin-bottom: 16px; }
  .option .sect p { font: 400 1.02rem/1.85 'Lato'; max-width: 560px; }
  .option .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
  .option .card { border-radius: 16px; padding: 36px; transition: transform 0.4s, box-shadow 0.4s; }
  .option .card:hover { transform: translateY(-3px); }
  .option .card h3 { font: 700 1.1rem/1.3 'Lato'; margin-bottom: 8px; }
  .option .card p { font-size: 0.92rem; }
  .option .card .num { font: 700 0.65rem/1 'Lato'; letter-spacing: 3px; margin-bottom: 14px; }

  .option .metrics { display: flex; gap: 52px; margin-top: 48px; }
  .option .metric .val { font: 700 2.8rem/1 'Playfair Display'; }
  .option .metric .lbl { font: 700 0.7rem/1 'Lato'; letter-spacing: 1.5px; margin-top: 8px; text-transform: uppercase; }

  .option .cta-btn {
    display: inline-block; padding: 14px 32px; font: 700 0.72rem/1 'Lato';
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    border-radius: 8px; margin-top: 36px; transition: all 0.3s; border: none;
  }

  .option .footer { padding: 52px 80px; text-align: center; }
  .option .footer .quote { font: italic 400 1rem/1.6 'Playfair Display'; }
  .option .footer .copy { font: 400 0.75rem/1 'Lato'; margin-top: 16px; letter-spacing: 1px; }

  /*
    ROLE SYSTEM:
    GREEN  = base (headings on dark, hero dark bg, footer, section accents)
    GOLD   = spark (labels, numbers, accent lines, card numbers, dividers)
    SILVER = support (body text, muted labels, borders, card body text)
  */

  /* ===== P1: EMERALD BASE, bright, confident ===== */
  /* Green: #1B4332 (deep) / #2D6A4F (mid) / #52B788 (light) */
  /* Gold: #C9A84C (warm) / #B39B5C (muted) */
  /* Silver: #8A8E88 (body) / #B4B8B2 (muted) / #E4E6E2 (borders) */
  .p1 { background: #F6F7F4; }
  .p1 .hero { background: linear-gradient(175deg, #F6F7F4 0%, #EAF0E8 60%, #F4F2EC 100%); }
  .p1 .hero .glow-1 { background: #2D6A4F; }
  .p1 .hero .glow-2 { background: #C9A84C; }
  .p1 .hero .label { color: #C9A84C; }
  .p1 .hero h1 { color: #1B4332; }
  .p1 .hero .sub { color: #6A7A6E; }
  .p1 .hero .divider { background: linear-gradient(90deg, #C9A84C, #E4D9A8); }
  .p1 .sect .label { color: #C9A84C; }
  .p1 .sect h2 { color: #1B4332; }
  .p1 .sect p { color: #556B5A; }
  .p1 .sect-alt { background: #EDF0E8; }
  .p1 .card { background: #FDFDFB; box-shadow: 0 2px 28px rgba(27,67,50,0.04); border: 1px solid #E4E6E0; }
  .p1 .card:hover { box-shadow: 0 8px 40px rgba(27,67,50,0.08); border-color: #D0D4CC; }
  .p1 .card h3 { color: #1B4332; }
  .p1 .card p { color: #6A7A6E; }
  .p1 .card .num { color: #C9A84C; }
  .p1 .metric .val { color: #C9A84C; }
  .p1 .metric .lbl { color: #8A8E88; }
  .p1 .cta-btn { background: #1B4332; color: #F6F7F4; }
  .p1 .cta-btn:hover { background: #2D6A4F; }
  .p1 .footer { background: #1B4332; }
  .p1 .footer .quote { color: #C9A84C; opacity: 0.5; }
  .p1 .footer .copy { color: #52B788; opacity: 0.3; }

  /* ===== P2: SAGE BASE, quieter, warmer ===== */
  /* Green: #2C4A38 (deep) / #4A7A5C (mid) / #8BAF9A (light) */
  /* Gold: #B39B5C (warm) / #D4C28A (light) */
  /* Silver: #8A8880 (body) / #B0AEA6 (muted) / #DCD8D0 (borders) */
  .p2 { background: #F5F4EF; }
  .p2 .hero { background: linear-gradient(175deg, #F5F4EF 0%, #E6EAE2 60%, #F2EEE6 100%); }
  .p2 .hero .glow-1 { background: #4A7A5C; }
  .p2 .hero .glow-2 { background: #B39B5C; }
  .p2 .hero .label { color: #B39B5C; }
  .p2 .hero h1 { color: #2C4A38; }
  .p2 .hero .sub { color: #6E7A6A; }
  .p2 .hero .divider { background: linear-gradient(90deg, #B39B5C, #D4C28A); }
  .p2 .sect .label { color: #B39B5C; }
  .p2 .sect h2 { color: #2C4A38; }
  .p2 .sect p { color: #565E50; }
  .p2 .sect-alt { background: #ECE8E0; }
  .p2 .card { background: #FBFAF7; box-shadow: 0 2px 28px rgba(44,74,56,0.04); border: 1px solid #DCD8D0; }
  .p2 .card:hover { box-shadow: 0 8px 40px rgba(44,74,56,0.07); border-color: #C8C4BC; }
  .p2 .card h3 { color: #2C4A38; }
  .p2 .card p { color: #6E7A6A; }
  .p2 .card .num { color: #B39B5C; }
  .p2 .metric .val { color: #B39B5C; }
  .p2 .metric .lbl { color: #8A8880; }
  .p2 .cta-btn { background: #2C4A38; color: #F5F4EF; }
  .p2 .cta-btn:hover { background: #3A6048; }
  .p2 .footer { background: #2C4A38; }
  .p2 .footer .quote { color: #B39B5C; opacity: 0.5; }
  .p2 .footer .copy { color: #8BAF9A; opacity: 0.3; }

  /* ===== P3: DEEP FOREST, darkest green, most gold presence ===== */
  /* Green: #0A1F13 (deep) / #1B4332 (mid) / #40916C (light) */
  /* Gold: #D4AF37 (rich) / #E8CC6A (light) */
  /* Silver: #9A9690 (body) / #C0BEB8 (muted) / #E0DED8 (borders) */
  .p3 { background: #F4F3EE; }
  .p3 .hero { background: linear-gradient(175deg, #F4F3EE 0%, #E0E8DE 60%, #F0ECE2 100%); }
  .p3 .hero .glow-1 { background: #1B4332; }
  .p3 .hero .glow-2 { background: #D4AF37; }
  .p3 .hero .label { color: #D4AF37; }
  .p3 .hero h1 { color: #0A1F13; }
  .p3 .hero .sub { color: #6A7868; }
  .p3 .hero .divider { background: linear-gradient(90deg, #D4AF37, #E8CC6A); }
  .p3 .sect .label { color: #D4AF37; }
  .p3 .sect h2 { color: #0A1F13; }
  .p3 .sect p { color: #4A5A48; }
  .p3 .sect-alt { background: #E8E6DC; }
  .p3 .card { background: #FAF9F5; box-shadow: 0 2px 28px rgba(10,31,19,0.04); border: 1px solid #E0DED8; }
  .p3 .card:hover { box-shadow: 0 8px 40px rgba(10,31,19,0.08); border-color: #CCC8C0; }
  .p3 .card h3 { color: #0A1F13; }
  .p3 .card p { color: #6A7868; }
  .p3 .card .num { color: #D4AF37; }
  .p3 .metric .val { color: #D4AF37; }
  .p3 .metric .lbl { color: #9A9690; }
  .p3 .cta-btn { background: #0A1F13; color: #F4F3EE; }
  .p3 .cta-btn:hover { background: #1B4332; }
  .p3 .footer { background: #0A1F13; }
  .p3 .footer .quote { color: #D4AF37; opacity: 0.45; }
  .p3 .footer .copy { color: #40916C; opacity: 0.25; }

  /* ===== P4: SILVER-LED, silver dominates, green + gold accent ===== */
  /* Green: #2A5040 (accent only) / #5B8A70 (links) */
  /* Gold: #B8A050 (spark accents) */
  /* Silver: #4A4E4C (heading) / #6A706C (body) / #A0A4A0 (muted) / #D8DAD6 (borders) */
  .p4 { background: #F4F5F3; }
  .p4 .hero { background: linear-gradient(175deg, #F4F5F3 0%, #E6E8E4 60%, #F0F0EC 100%); }
  .p4 .hero .glow-1 { background: #5B8A70; opacity: 0.06; }
  .p4 .hero .glow-2 { background: #B8A050; opacity: 0.06; }
  .p4 .hero .label { color: #B8A050; }
  .p4 .hero h1 { color: #2A3430; }
  .p4 .hero .sub { color: #6A706C; }
  .p4 .hero .divider { background: linear-gradient(90deg, #5B8A70, #B8A050); }
  .p4 .sect .label { color: #B8A050; }
  .p4 .sect h2 { color: #2A3430; }
  .p4 .sect p { color: #555A56; }
  .p4 .sect-alt { background: #EAECE6; }
  .p4 .card { background: #FAFAF8; box-shadow: 0 2px 28px rgba(42,52,48,0.04); border: 1px solid #D8DAD6; }
  .p4 .card:hover { box-shadow: 0 8px 40px rgba(42,52,48,0.07); border-color: #C4C6C2; }
  .p4 .card h3 { color: #2A3430; }
  .p4 .card p { color: #6A706C; }
  .p4 .card .num { color: #5B8A70; }
  .p4 .metric .val { color: #5B8A70; }
  .p4 .metric .lbl { color: #A0A4A0; }
  .p4 .cta-btn { background: #2A5040; color: #F4F5F3; }
  .p4 .cta-btn:hover { background: #3A6650; }
  .p4 .footer { background: #2A3430; }
  .p4 .footer .quote { color: #B8A050; opacity: 0.4; }
  .p4 .footer .copy { color: #6A706C; opacity: 0.4; }

  /* ===== P5: WARM BLEND, all three equally warm ===== */
  /* Green: #3A6A4E (mid warm) / #6A9A7A (light) */
  /* Gold: #C4A44A (rich warm) / #DCC878 (soft) */
  /* Silver: #7A7872 (warm silver body) / #A8A49C (muted) / #D8D4CA (borders) */
  .p5 { background: #F6F4EE; }
  .p5 .hero { background: linear-gradient(160deg, #EEF2E8 0%, #F6F4EE 50%, #F2ECE0 100%); }
  .p5 .hero .glow-1 { background: #3A6A4E; }
  .p5 .hero .glow-2 { background: #C4A44A; }
  .p5 .hero .label { color: #C4A44A; }
  .p5 .hero h1 { color: #1E3026; }
  .p5 .hero .sub { color: #6A7466; }
  .p5 .hero .divider { background: linear-gradient(90deg, #3A6A4E, #C4A44A); }
  .p5 .sect .label { color: #C4A44A; }
  .p5 .sect h2 { color: #1E3026; }
  .p5 .sect p { color: #4E5A4A; }
  .p5 .sect-alt { background: #EAE6DC; }
  .p5 .card { background: #FBFAF6; box-shadow: 0 2px 28px rgba(30,48,38,0.04); border: 1px solid #D8D4CA; }
  .p5 .card:hover { box-shadow: 0 8px 40px rgba(30,48,38,0.08); border-color: #C4C0B6; }
  .p5 .card h3 { color: #1E3026; }
  .p5 .card p { color: #6A7466; }
  .p5 .card .num { color: #C4A44A; }
  .p5 .metric .val { color: #3A6A4E; }
  .p5 .metric .lbl { color: #A8A49C; }
  .p5 .cta-btn { background: linear-gradient(135deg, #3A6A4E, #4A7A5E); color: #F6F4EE; }
  .p5 .cta-btn:hover { background: linear-gradient(135deg, #2E5A40, #3A6A4E); }
  .p5 .footer { background: #1E3026; }
  .p5 .footer .quote { color: #C4A44A; opacity: 0.45; }
  .p5 .footer .copy { color: #6A9A7A; opacity: 0.3; }
</style>
</head>
<body>

<div class="switcher">
  <span>Palette</span>
  <button class="active" onclick="show(1)">Emerald + Gold + Silver</button>
  <button onclick="show(2)">Sage + Gold + Silver</button>
  <button onclick="show(3)">Deep Forest + Rich Gold</button>
  <button onclick="show(4)">Silver-Led + Green/Gold Accents</button>
  <button onclick="show(5)">Warm Blend (equal weight)</button>
</div>

<script>
const palettes = ['p1','p2','p3','p4','p5'];

function makeOpt(id, cls) {
  return `<div class="option ${cls} ${id===1?'active':''}" id="opt${id}">
    <div class="hero">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="inner">
        <div class="label">Kenotic Labs</div>
        <h1>We gave machines intelligence.<br>We never gave them time.</h1>
        <p class="sub">The hard part is continuity. The ability to carry forward what matters, update it when reality changes, and reconstruct it when it is needed again.</p>
        <div class="divider"></div>
      </div>
    </div>
    <div class="sect">
      <div class="label">What We Build</div>
      <h2>The continuity layer.</h2>
      <p>Continuity is the system property that lets an AI carry forward what still matters, update it when reality changes, and reconstruct useful context later.</p>
      <div class="grid2">
        <div class="card"><div class="num">01</div><h3>Reconstruction</h3><p>Not finding old facts. Rebuilding the current picture from structured traces.</p></div>
        <div class="card"><div class="num">02</div><h3>Disambiguation</h3><p>250 lives in one system. Each story stays separate from every other.</p></div>
        <div class="card"><div class="num">03</div><h3>Update Handling</h3><p>The appointment moved. The plan changed. Old state gets superseded.</p></div>
        <div class="card"><div class="num">04</div><h3>Temporal Ordering</h3><p>Not just what happened. When, in what order, and what's still true.</p></div>
      </div>
    </div>
    <div class="sect sect-alt">
      <div class="label">Evidence</div>
      <h2>Tested against 250 narratives.</h2>
      <p>ATANT is the first open evaluation framework for AI continuity. No LLM in the evaluation loop. Deterministic. Reproducible.</p>
      <div class="metrics">
        <div class="metric"><div class="val">250</div><div class="lbl">Stories</div></div>
        <div class="metric"><div class="val">1,835</div><div class="lbl">Questions</div></div>
        <div class="metric"><div class="val">96%</div><div class="lbl">Cumulative</div></div>
        <div class="metric"><div class="val">10</div><div class="lbl">Checkpoints</div></div>
      </div>
      <button class="cta-btn">View the Standard</button>
    </div>
    <div class="footer">
      <p class="quote">What knows you well, should wish you well.</p>
      <p class="copy">© 2026 Kenotic Labs. All rights reserved.</p>
    </div>
  </div>`;
}

const wrapper = document.createElement('div');
palettes.forEach((c, i) => wrapper.innerHTML += makeOpt(i+1, c));
document.body.appendChild(wrapper);

function show(n) {
  document.querySelectorAll('.option').forEach(el => { el.style.display='none'; el.classList.remove('active'); });
  document.getElementById('opt'+n).style.display='block';
  document.getElementById('opt'+n).classList.add('active');
  document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  window.scrollTo(0,0);
}
</script>

</body>
</html>
